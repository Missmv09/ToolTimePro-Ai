[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  # Node 22, not 20. @supabase/supabase-js requires a native WebSocket, which
  # Node 20 does not provide — constructing a client threw "Node.js detected but
  # native WebSocket not found" and took down every function that talks to the
  # database. Node 20 is also past end-of-life. Keep this in step with .nvmrc,
  # package.json engines, and the workflows in .github/workflows.
  NODE_VERSION = "22"
  SECRETS_SCAN_ENABLED = "false"

# ============================================================
# Sandbox / staging branch deploy
# The `sandbox` branch gets its own build context so you can
# point it at a second Supabase project and Stripe test keys
# via Netlify's branch-scoped environment variables.
# Set branch-scoped vars in Netlify UI: Site settings →
# Environment variables → "Specific scopes" → branch = sandbox.
# See docs/SANDBOX.md for the full runbook.
# ============================================================
[context.sandbox]
  command = "npm run build"

[context.sandbox.environment]
  NEXT_PUBLIC_APP_ENV = "sandbox"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[functions]
  node_bundler = "esbuild"

# Note: API routes are handled automatically by @netlify/plugin-nextjs
# Do NOT add redirects for /api/* as they interfere with Next.js App Router

# ============================================================
# Scheduled Functions (Cron Jobs)
# These call internal API routes on a schedule.
# Netlify runs them as background functions.
# ============================================================

# Jenny Autonomous Actions — runs every 15 minutes
# Checks for: unassigned jobs, cold leads to follow up,
# overdue invoices, completed jobs needing cost analysis
[functions."jenny-actions-cron"]
  schedule = "*/15 * * * *"

# HR Law Update Check — runs every Monday at 8am UTC
# Checks state employment law freshness (wages, classification, breaks)
# Alerts when compliance rules are older than 6 months
[functions."hr-law-update-cron"]
  schedule = "0 8 * * 1"

# Workforce Compliance — runs every Monday at 7am UTC
# Checks: cert expirations, insurance expiry, missing W-9s,
# classification review cycles, contract end dates
[functions."workforce-compliance-cron"]
  schedule = "0 7 * * 1"

# Daily Business Checks — runs every day at 7am UTC
# Checks: quote expirations, contractor payment approvals,
# compliance alert escalation, review requests
[functions."daily-business-cron"]
  schedule = "0 7 * * *"

# Trial Reminders — runs once per day at 9am UTC
# Sends trial welcome, reminder, and expiration emails
[functions."trial-reminders-cron"]
  schedule = "0 9 * * *"

# Supabase Keep-Alive — runs every 3 days at 6am UTC
# Pings every configured Supabase project (Prod + Sandbox) in one run with a
# real SQL query to prevent free-tier projects from pausing (7-day inactivity
# limit). Set SUPABASE_SANDBOX_URL / SUPABASE_SANDBOX_KEY to include sandbox.
[functions."supabase-keepalive-cron"]
  schedule = "0 6 */3 * *"

# Google Calendar Sync — runs every 30 minutes
# Pushes each connected user's upcoming (next 30 days) jobs to their Google
# Calendar so the sync is automatic without clicking "Sync Now".
[functions."calendar-sync-cron"]
  schedule = "*/30 * * * *"

# Growth Funnel Snapshot — runs daily at 5am UTC
# Records one row per day in growth_metrics_daily: leads captured by source,
# signups, trials, paid accounts, and the derived conversion rates. This is the
# time series the growth agent planner reads. Runs before the other daily crons
# so the snapshot reflects a settled previous day.
[functions."growth-metrics-cron"]
  schedule = "0 5 * * *"

# Growth Agent Planner — runs Mondays at 6am UTC
# Fires growth-agent-plan-background, which reads the funnel time series, past
# experiment outcomes, and the content inventory, then proposes a ranked week of
# work into growth_tasks with status 'proposed'. It only proposes — nothing
# reaches the public until a human approves it in /admin/growth.
#
# The work lives in a *background* function because scheduled functions cap at
# 30s and synchronous ones at 10s, while an Opus planning call runs longer than
# both. Background functions get 15 minutes.
[functions."growth-agent-plan-cron"]
  schedule = "0 6 * * 1"

# Growth Agent Generator — runs weekdays at 7am UTC
# Fires growth-agent-generate-background, which turns *approved* tasks into
# draft assets. Approved only: generating for an unreviewed proposal spends
# tokens on work that may be rejected, and puts a finished-looking draft in
# front of the reviewer that biases the decision.
#
# Background function for the same timeout reason as the planner — it makes up
# to three sequential AI calls.
[functions."growth-agent-generate-cron"]
  schedule = "0 7 * * 1-5"

# Appointment Reminders + Post-Job Follow-ups — runs once daily (16:00 UTC)
# Texts customers a reminder the day before a job, and a thank-you + review
# request after a job is completed. Runs once a day so a customer gets at most
# one reminder (the day before), even independent of the per-job "sent" flag.
[functions."appointment-reminders-cron"]
  schedule = "0 16 * * *"
