<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 150" role="img" aria-label="Shield Iguana">
  <defs>
    <linearGradient id="si-sig" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#1FE3C4"/>
      <stop offset="1" stop-color="#2E9BFF"/>
    </linearGradient>
    <linearGradient id="si-eye" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#33ECD0"/>
      <stop offset="1" stop-color="#2E9BFF"/>
    </linearGradient>
    <linearGradient id="si-frame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1FE3C4"/>
      <stop offset=".55" stop-color="#2E9BFF"/>
      <stop offset="1" stop-color="#2F7A55"/>
    </linearGradient>
    <linearGradient id="si-panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#101922"/>
      <stop offset="1" stop-color="#0A0D13"/>
    </linearGradient>
    <pattern id="si-scales" width="22" height="13" patternUnits="userSpaceOnUse">
      <path d="M-11 13 A11 11 0 0 1 11 13 M11 13 A11 11 0 0 1 33 13 M0 0 A11 11 0 0 1 22 0 M22 0 A11 11 0 0 1 44 0"
            fill="none" stroke="#1FE3C4" stroke-opacity=".18" stroke-width="1.3"/>
    </pattern>
  </defs>

  <!-- crest: four ascending sails on a swoosh (the Task Iguana mark) -->
  <path d="M40 24 Q60 14 84 18" fill="none" stroke="url(#si-sig)" stroke-width="3.4" stroke-linecap="round"/>
  <g stroke="url(#si-sig)" stroke-width="4.6" stroke-linecap="round" fill="none">
    <path d="M46 22 L49 10"/>
    <path d="M55 21 L59 6"/>
    <path d="M64 20.5 L69 5"/>
    <path d="M73 20.5 L79 8"/>
  </g>

  <!-- shield -->
  <path d="M60 22 L110 36 V80 C110 114 87 134 60 144 C33 134 10 114 10 80 V36 Z" fill="url(#si-frame)"/>
  <path d="M60 31 L101 43 V79 C101 108 82 126 60 134 C38 126 19 108 19 79 V43 Z" fill="url(#si-panel)"/>
  <path d="M60 31 L101 43 V79 C101 108 82 126 60 134 C38 126 19 108 19 79 V43 Z" fill="url(#si-scales)"/>

  <!-- reptile eye -->
  <circle cx="60" cy="78" r="19" fill="url(#si-eye)"/>
  <ellipse cx="60" cy="78" rx="5.6" ry="15" fill="#0A0C11"/>
  <circle cx="55.5" cy="71.5" r="2.6" fill="#EAF1F4" opacity=".9"/>
</svg>
