name: Smoke (deployed)

# Post-deploy smoke tests against a LIVE url (sandbox or prod). Unlike ci.yml —
# which runs unit tests + build against placeholder env vars on every push —
# this exercises a real running deployment: the health/env diagnostic plus the
# critical public pages and the booking/quote demos via Cypress.
#
# Trigger it three ways:
#   • Manually (Actions tab → "Run workflow") with a base_url input
#   • On a daily schedule against the repo variable SMOKE_BASE_URL
#
# Configure once in repo Settings:
#   • Variables → SMOKE_BASE_URL   e.g. https://sandbox--<site>.netlify.app
#   • Secrets   → HEALTH_CHECK_TOKEN (same value as the Netlify env var)

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Base URL to smoke test (defaults to the SMOKE_BASE_URL repo variable)'
        required: false
        type: string
  schedule:
    # 14:00 UTC daily — adjust or remove as needed.
    - cron: '0 14 * * *'

jobs:
  resolve-url:
    runs-on: ubuntu-latest
    outputs:
      base_url: ${{ steps.pick.outputs.base_url }}
    steps:
      - id: pick
        run: |
          URL="${{ github.event.inputs.base_url }}"
          if [ -z "$URL" ]; then URL="${{ vars.SMOKE_BASE_URL }}"; fi
          if [ -z "$URL" ]; then
            echo "::warning::No base URL provided (set the SMOKE_BASE_URL repo variable or pass base_url). Skipping."
          fi
          echo "base_url=$URL" >> "$GITHUB_OUTPUT"

  http-smoke:
    needs: resolve-url
    if: needs.resolve-url.outputs.base_url != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: HTTP smoke (health + public pages)
        env:
          SMOKE_BASE_URL: ${{ needs.resolve-url.outputs.base_url }}
          HEALTH_CHECK_TOKEN: ${{ secrets.HEALTH_CHECK_TOKEN }}
        run: node scripts/smoke-test.js

  cypress-smoke:
    needs: resolve-url
    if: needs.resolve-url.outputs.base_url != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Warm up the deployment (avoid serverless cold-start flakiness)
        env:
          BASE_URL: ${{ needs.resolve-url.outputs.base_url }}
        run: |
          # A cold Netlify function can take >60s on first hit, which makes the
          # Cypress smoke run flaky (and painfully slow) right after a deploy.
          # Pre-warm the public routes the specs visit — two passes, failures
          # ignored — so Cypress runs against already-warm pages. Best-effort:
          # this step never fails the job.
          #
          # -L is load-bearing, not decoration. next.config.js sets
          # `trailingSlash: true`, so every path except `/` answers 308 and the
          # page itself is never rendered. Without -L this loop warmed exactly
          # one route while reporting a wall of 308s that read like success —
          # which is how Cypress kept hitting cold functions and dying with
          # ETIMEDOUT on /, /pricing and /tools (runs 74 and 75).
          #
          # The path list comes from smoke-test.js so the two cannot drift: a
          # page added there is warmed here automatically.
          #
          # Every command below is guarded: this step is diagnostic only and
          # must never be the thing that fails the job (the shell runs -e).
          paths=$(node scripts/smoke-test.js --list-paths)
          for pass in 1 2; do
            echo "— Warm-up pass $pass —"
            for p in $paths; do
              out=$(curl -sL -o /dev/null -w "%{http_code} %{time_total}" \
                --max-time 90 "$BASE_URL$p") || out="ERR -"
              code=${out%% *}
              secs=${out##* }
              # Flag anything still slow once warm: a page that needs seconds on
              # the second pass is the one that will time out under Cypress.
              slow=""
              if [ "$pass" = 2 ] && [ "${secs%%.*}" -ge 5 ] 2>/dev/null; then
                slow="  <-- still slow when warm"
              fi
              if [ "$code" = ERR ]; then timing="(no response)"; else timing="${secs}s"; fi
              printf '  %-28s -> %-4s %s%s\n' "$p" "$code" "$timing" "$slow"
            done
          done

      - name: Run Cypress against the deployment
        uses: cypress-io/github-action@v6
        with:
          install-command: npm ci
          config: baseUrl=${{ needs.resolve-url.outputs.base_url }}
        env:
          # All current specs hit public/demo routes, so they run against a live
          # deploy with no seeded data or login required.
          CYPRESS_baseUrl: ${{ needs.resolve-url.outputs.base_url }}

      # These specs run against a DEPLOYED url, so a failure cannot be
      # reproduced from the checkout afterwards — the screenshot is the only
      # record of what the page actually served. e2e.yml already does this for
      # both of its jobs; smoke was the one red surface still discarding them.
      - name: Upload Cypress screenshots (smoke)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots-smoke
          path: cypress/screenshots
          if-no-files-found: ignore
          retention-days: 14
