name: E2E (Cypress)

on:
  push:
    branches: [main, sandbox]
  pull_request:
    branches: [main, sandbox]
  workflow_dispatch:

jobs:
  # Public / unauthenticated E2E — builds and serves the app locally, no secrets
  # needed. This is the always-on regression gate.
  e2e-public:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Cypress run (public specs against a local build)
        uses: cypress-io/github-action@v6
        with:
          build: npm run build
          start: npm start
          wait-on: 'http://localhost:3000'
          wait-on-timeout: 120
          spec: cypress/e2e/public-pages.cy.js,cypress/e2e/public-extended.cy.js,cypress/e2e/booking-demo.cy.js
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder

  # Authenticated E2E — runs against the deployed sandbox with a real login.
  # Skips automatically until the E2E_* secrets are configured, so it never
  # breaks CI before you wire them up.
  e2e-authenticated:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Check for E2E credentials
        id: guard
        env:
          E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
        run: |
          if [ -z "$E2E_EMAIL" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::warning::E2E_EMAIL secret not set — skipping authenticated E2E. Add E2E_EMAIL, E2E_PASSWORD, and E2E_BASE_URL repo secrets to enable."
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Warm up the deployment (avoid serverless cold-start flakiness)
        if: steps.guard.outputs.run == 'true'
        env:
          BASE_URL: ${{ secrets.E2E_BASE_URL }}
        run: |
          # Right after a deploy every Netlify function is cold, and the first
          # hit to a heavy page can exceed 60s. cy.login() only allows 25s to
          # reach /dashboard, so a cold sandbox fails the `before each` hook and
          # takes the whole authenticated suite down with it — which is exactly
          # what happened on the Next 16 merge. Pre-warm the routes the specs
          # visit (two passes, failures ignored, 60s cap per request) so Cypress
          # runs against warm pages. Mirrors the same step in smoke.yml.
          # Best-effort: this step never fails the job.
          paths="/auth/login /dashboard /dashboard/customers /dashboard/jobs /dashboard/quotes /dashboard/invoices /quote/demo"
          for pass in 1 2; do
            echo "— Warm-up pass $pass —"
            for p in $paths; do
              code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 60 "$BASE_URL$p" || echo "ERR")
              echo "  $p -> $code"
            done
          done
      - name: Cypress run (authenticated, against the sandbox)
        if: steps.guard.outputs.run == 'true'
        uses: cypress-io/github-action@v6
        with:
          install: true
          spec: cypress/e2e/authenticated-flows.cy.js,cypress/e2e/customer-portal.cy.js,cypress/e2e/multi-tenant-isolation.cy.js,cypress/e2e/quote-public-link.cy.js
          config: baseUrl=${{ secrets.E2E_BASE_URL }}
        env:
          CYPRESS_E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
          CYPRESS_E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
          # Second company for TC-X-01 (multi-tenant isolation). When unset, that
          # spec skips itself; forwarding these activates it.
          CYPRESS_E2E_EMAIL_2: ${{ secrets.E2E_EMAIL_2 }}
          CYPRESS_E2E_PASSWORD_2: ${{ secrets.E2E_PASSWORD_2 }}
